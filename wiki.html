<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人Wiki</title>
    <style>
        /* 整体页面的基本样式设置 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* 头部导航栏样式 */
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* 侧边栏样式 */
        aside {
            width: 200px;
            background-color: #ccc;
            float: left;
            height: 100vh;
            padding: 10px;
        }

        /* 主要内容区域样式 */
        main {
            margin-left: 220px;
            padding: 20px;
        }

        /* 文章标题样式 */
        h1 {
            color: #333;
        }

        /* 段落样式 */
        p {
            line-height: 1.6;
        }

        /* 链接样式 */
        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* 图片样式，可根据需求调整尺寸等 */
        img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <!-- 头部区域 -->
    <header>
        <h1>个人Wiki</h1>
    </header>

    <!-- 侧边栏区域，可以放置导航链接等 -->
    <aside>
        <ul>
            <li><a href="#about-me">关于我</a></li>
            <li><a href="#interests">兴趣爱好</a></li>
            <li><a href="#skills">技能</a></li>
        </ul>
    </aside>

    <!-- 主要内容区域 -->
    <main>
        <!-- 关于我部分 -->
        <section id="about-me">
            <h2>关于我</h2>
            <img src="证件-已增强-SR.JPG" alt="我的照片">
            <p>实名上网王梓珺</p>
        </section>

        <!-- 兴趣爱好部分 -->
        <section id="interests">
            <h2>兴趣爱好</h2>
            <p>乐意玩迪克</p>
        </section>

        <!-- 技能部分 -->
        <section id="skills">
            <h2>技能</h2>
            <p>迪克</p>
        </section>
    </main>

    <!-- 页面底部区域，可添加版权等信息 -->
    <footer>
        <p>&copy; 2025 王梓珺. All rights reserved.</p>
    </footer>
</body>

</html>
